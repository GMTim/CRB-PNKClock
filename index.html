<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CBR+PNK Clock Monitor</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body class="is-loading">
    <main class="shell">
      <section class="masthead" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">RPG Clock uplink</p>
          <h1 id="page-title" class="glitch-title" data-text="Loading">Loading</h1>
        </div>
        <div class="status-panel" aria-live="polite">
          <span class="status-light" id="status-light"></span>
          <span id="status-text">Offline</span>
        </div>
      </section>

      <section class="readout" aria-live="polite">
        <div class="game-banner">
          <div>
            <p class="eyebrow">Current job</p>
            <h2 id="game-title">Loading</h2>
          </div>
          <p id="game-tagline">Auto-connecting to the live RPGClock2 uplink.</p>
        </div>

        <div id="clock-groups" class="clock-groups">
          <div class="uplink-loader" role="status" aria-live="polite">
            <div class="loader-core" aria-hidden="true">
              <span class="loader-ring loader-ring--outer"></span>
              <span class="loader-ring loader-ring--middle"></span>
              <span class="loader-ring loader-ring--inner"></span>
              <span class="loader-sweep"></span>
              <span class="loader-node loader-node--one"></span>
              <span class="loader-node loader-node--two"></span>
              <span class="loader-node loader-node--three"></span>
              <span class="loader-readout">00:00</span>
            </div>
            <div class="loader-copy">
              <p class="eyebrow">Signal handshake</p>
              <p class="loader-title">Spinning up the clock feed</p>
              <p class="loader-subtitle">Routing through the live RPGClock2 uplink.</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
